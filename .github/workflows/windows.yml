name: PT2VHF Sat Tool - Windows 10/11 x64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    name: Preparar GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar versão e tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python3 -c 'from sat_tool import __version__; print(__version__)')
          test "$ver" = '1.5.0'
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$ver" ]]; then
            echo '::error::Tag Git diferente da versão do aplicativo'
            exit 1
          fi
      - name: Criar release quando ainda não existir
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "PT2VHF Sat Tool $RELEASE_TAG — Windows, Linux e macOS" \
              --notes 'Compilação Windows 10/11 x64 (Setup/Portable), Linux x64 e macOS ARM64. Downloads e OTA pelo site oficial https://www.pt2vhf.com/sat.' --prerelease
          fi
  build:
    needs: prepare_release
    name: ${{ matrix.target }} - Portable e Instalador
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win11-x64
            python: '3.11'
            architecture: 'x64'
            dependencies: requirements-win11.txt
            pyinstaller: '6.13.0'
            pytest: '8.3.5'
            min_windows: '10.0.17763' # Windows 10 1809+ x64 AND Windows 11; Qt6 edition name retained for updater compatibility
            inno_arch: 'x64compatible'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python ${{ matrix.python }} - ${{ matrix.architecture }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install build stack
        shell: pwsh
        run: |
          python -m pip install --upgrade 'pip<25.1'
          python -m pip install -r '${{ matrix.dependencies }}'
          python -m pip install 'pyinstaller==${{ matrix.pyinstaller }}' 'pytest==${{ matrix.pytest }}' 'Pillow==10.4.0'
          python -m pip check
      - name: Unit tests and Qt binding smoke test
        shell: pwsh
        run: |
          python -m compileall -q sat_tool
          if ($LASTEXITCODE -ne 0) { throw 'Python source does not compile' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Unit/regression tests failed; release blocked' }
          python -c "from sat_tool.qt_compat import QT_BINDING,QWebEngineView,QGeoPositionInfoSource; import sat_tool.app; print('Qt binding:',QT_BINDING)"
          if ($LASTEXITCODE -ne 0) { throw 'Qt GUI module import failed; release blocked' }
          if ('${{ matrix.target }}' -eq 'Win7-x86') {
            python -c "import struct; from sat_tool.qt_compat import QT_BINDING; assert 8*struct.calcsize('P')==32 and QT_BINDING=='PySide2'"
          } else {
            python -c "import struct; from sat_tool.qt_compat import QT_BINDING; assert 8*struct.calcsize('P')==64 and QT_BINDING=='PySide6'"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Qt binding/architecture validation failed' }
      - name: Generate and verify Windows brand icons
        shell: pwsh
        run: |
          python scripts/build_brand_assets.py
          if (-not (Test-Path 'assets/branding/app-icon.ico')) { throw 'Brand icon missing' }
          if (-not (Test-Path 'assets/branding/icon-256.png')) { throw 'Brand PNG missing' }
      - name: libwdi wdi-simple (driver WinUSB do RTL-SDR, plug and play)
        shell: cmd
        env:
          WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
        run: |
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi.git ..\libwdi || exit /b 1
          cd ..\libwdi
          rem Somente WinUSB: retira libusb0/libusbK do embedder (o PT2VHF nunca instala esses drivers).
          powershell -NoProfile -Command "(Get-Content msvc\config.h) | Where-Object { $_ -notmatch '^#define LIBUSB(0|K)_DIR' } | Set-Content msvc\config.h" || exit /b 1
          findstr /R "^#define LIBUSB" msvc\config.h && exit /b 1
          curl -sSL %WDK_URL% -o wdk-redist.msi || exit /b 1
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          if not exist "wdk\Windows Kits\8.0\redist\wdf\x64" (echo WDK redist ausente & exit /b 1)
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          rem o embedder inclui os instaladores de 32 e 64 bits: compilar Win32 antes do x64
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=Win32,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=x64,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          if not exist x64\Release\examples\wdi-simple.exe exit /b 1
          mkdir %GITHUB_WORKSPACE%\drivers
          copy /y x64\Release\examples\wdi-simple.exe %GITHUB_WORKSPACE%\drivers\ || exit /b 1
          copy /y COPYING-LGPL %GITHUB_WORKSPACE%\drivers\libwdi-COPYING-LGPL.txt
          %GITHUB_WORKSPACE%\drivers\wdi-simple.exe --help | findstr /C:"WinUSB" || exit /b 1
      - name: PyInstaller (native Windows EXE)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PT2VHF-Sat-Tool `
            --icon 'assets/branding/app-icon.ico' --add-data 'sat_tool/map.html;sat_tool' --add-data 'assets/branding/icon-256.png;assets/branding' --add-data 'scripts/apply-update.ps1;scripts' --hidden-import sat_tool.app --hidden-import sat_tool.cat --collect-all skyfield --collect-binaries numpy --collect-all pyrtlsdrlib --collect-all satnogsdecoders --collect-submodules rtlsdr --hidden-import sat_tool.sdr_panel --hidden-import PySide6.QtMultimedia --add-data 'drivers/wdi-simple.exe;drivers' --add-data 'drivers/libwdi-COPYING-LGPL.txt;drivers' `
            run.py
          if (-not (Test-Path 'dist/PT2VHF-Sat-Tool/PT2VHF-Sat-Tool.exe')) { throw 'Executable missing' }
          if (-not (Get-ChildItem 'dist/PT2VHF-Sat-Tool' -Recurse -Filter 'apply-update.ps1')) {throw 'Updater not packaged'}
          if (-not (Get-ChildItem 'dist/PT2VHF-Sat-Tool' -Recurse -Filter 'wdi-simple.exe')) {throw 'RTL-SDR driver installer not packaged'}
      - name: Smoke test of packaged executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/PT2VHF-Sat-Tool/PT2VHF-Sat-Tool.exe').Path
          $report = Join-Path $env:RUNNER_TEMP 'sattool-selftest-${{ matrix.target }}.json'
          $expected = if ('${{ matrix.target }}' -eq 'Win7-x86') { 'PySide2' } else { 'PySide6' }
          $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report, $expected) -Wait -PassThru
          foreach ($debug in @('pt2vhf-selftest-argv.txt','pt2vhf-selftest-error.txt','pt2vhf-selftest-import-error.txt','pt2vhf-selftest-phases.txt')) {
            $file = Join-Path $env:RUNNER_TEMP $debug
            if (Test-Path $file) { Write-Host "SELFTEST DEBUG $debug"; Get-Content $file }
          }
          if (-not (Test-Path $report)) { throw "EXE sem relatório de autoteste; exit: $($proc.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if ($proc.ExitCode -ne 0 -or $result.status -ne 'passed' -or -not $result.frozen) { throw 'Autoteste do EXE falhou, release bloqueada.' }
          if ($result.versions.qt_binding -ne $expected) { throw 'Qt binding incorreto' }
          if ('${{ matrix.target }}' -eq 'Win7-x86' -and $result.architecture_bits -ne 32) { throw 'Arquitetura não é x86' }
          if ('${{ matrix.target }}' -eq 'Win11-x64' -and $result.architecture_bits -ne 64) { throw 'Arquitetura não é x64' }
      - name: Portable ONEFILE EXE (sem ZIP)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name 'PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}-Portable' `
            --icon 'assets/branding/app-icon.ico' --add-data 'sat_tool/map.html;sat_tool' --add-data 'assets/branding/icon-256.png;assets/branding' --add-data 'scripts/apply-update.ps1;scripts' --hidden-import sat_tool.app --hidden-import sat_tool.cat --collect-all skyfield --collect-binaries numpy --collect-all pyrtlsdrlib --collect-all satnogsdecoders --collect-submodules rtlsdr --hidden-import sat_tool.sdr_panel --hidden-import PySide6.QtMultimedia --add-data 'drivers/wdi-simple.exe;drivers' --add-data 'drivers/libwdi-COPYING-LGPL.txt;drivers' `
            run.py
          $portable = (Resolve-Path 'dist/PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}-Portable.exe').Path
          if (-not (Test-Path $portable)) { throw 'Portable EXE missing' }
          $report = Join-Path $env:RUNNER_TEMP 'portable-onefile-${{ matrix.target }}.json'
          $binding = if ('${{ matrix.target }}' -eq 'Win7-x86') { 'PySide2' } else { 'PySide6' }
          $process = Start-Process -FilePath $portable -ArgumentList @('--self-test', $report, $binding) -Wait -PassThru
          foreach ($debug in @('pt2vhf-selftest-argv.txt','pt2vhf-selftest-error.txt','pt2vhf-selftest-import-error.txt','pt2vhf-selftest-phases.txt')) {
            $file = Join-Path $env:RUNNER_TEMP $debug
            if (Test-Path $file) { Write-Host "SELFTEST DEBUG $debug"; Get-Content $file }
          }
          if (-not (Test-Path $report)) { throw "Portable EXE nao iniciou: $($process.ExitCode)" }
          $diag = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if ($process.ExitCode -ne 0 -or $diag.status -ne 'passed' -or -not $diag.frozen) { throw 'Portable ONEFILE falhou no teste nativo. Release bloqueada.' }
      - name: Inno Setup installer (Windows 10/11 x64)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc '/DBuildFlavor=${{ matrix.target }}' '/DMinTarget=${{ matrix.min_windows }}' '/DTargetArch=${{ matrix.inno_arch }}' installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          if (-not (Test-Path 'dist/PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}-Setup.exe')) { throw 'Installer missing' }
      - name: Verify standalone EXEs and icon resources
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          $base = "dist/PT2VHF-Sat-Tool-v1.5.0-$target"
          if (-not (Test-Path "$base-Setup.exe" -PathType Leaf)) { throw 'Installer must be EXE' }
          if (-not (Test-Path "$base-Portable.exe" -PathType Leaf)) { throw 'Portable must be EXE onefile' }
          if (Get-ChildItem -Path dist -Filter '*.zip' -File) { throw 'No ZIP distribution permitted' }
          if (-not (Get-ChildItem 'dist/PT2VHF-Sat-Tool' -Recurse -Filter 'icon-256.png')) { throw 'Brand resource missing from installer payload' }
      - name: Checksums
        shell: pwsh
        run: |
          $items = Get-ChildItem 'dist/PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}-*' -File
          $lines = foreach ($item in $items) {
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -Path 'dist/PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}-SHA256.txt' -Encoding Ascii
      - name: Enviar pacotes Windows diretamente à GitHub Release (sem artifacts)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          $files = @(Get-ChildItem 'dist/PT2VHF-Sat-Tool-v1.5.0-Win11-x64-*' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw "Esperados 3 arquivos Windows; encontrados $($files.Count)" }
          gh release upload $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha no upload Windows para a GitHub Release' }
  build_unix:
    needs: prepare_release
    name: ${{ matrix.target }} - pacote
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux-x64
            os: ubuntu-22.04
          - target: macOS-arm64
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bibliotecas Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libasound2 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 \
            libpulse0 libpulse-mainloop-glib0
      - name: Dependências e testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade 'pip<25.1'
          python -m pip install -r requirements-win11.txt 'pyinstaller==6.13.0' 'pytest==8.3.5' 'Pillow==10.4.0'
          python -m compileall -q sat_tool
          python -m pytest -q tests
          python scripts/build_brand_assets.py
      - name: PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name PT2VHF-Sat-Tool \
            --icon assets/branding/icon-256.png --add-data 'sat_tool/map.html:sat_tool' \
            --add-data 'assets/branding/icon-256.png:assets/branding' \
            --hidden-import sat_tool.app --hidden-import sat_tool.cat --collect-all skyfield --collect-binaries numpy --collect-all pyrtlsdrlib --collect-all satnogsdecoders --collect-submodules rtlsdr --hidden-import sat_tool.sdr_panel --hidden-import PySide6.QtMultimedia \
            run.py
      - name: Autoteste do binário
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
        run: |
          if [ "$RUNNER_OS" = macOS ]; then exe=dist/PT2VHF-Sat-Tool.app/Contents/MacOS/PT2VHF-Sat-Tool; else exe=dist/PT2VHF-Sat-Tool/PT2VHF-Sat-Tool; fi
          report="$RUNNER_TEMP/selftest.json"
          "$exe" --self-test "$report" PySide6 || true
          for f in "$RUNNER_TEMP"/pt2vhf-selftest-*.txt; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done
          test -f "$report" && cat "$report"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['status']=='passed' and d['frozen'], d" "$report"
      - name: Empacotar
        run: |
          mkdir -p out
          base="PT2VHF-Sat-Tool-v1.5.0-${{ matrix.target }}"
          if [ "$RUNNER_OS" = macOS ]; then
            hdiutil create -volname "PT2VHF Sat Tool" -srcfolder dist/PT2VHF-Sat-Tool.app -ov -format UDZO "out/$base.dmg"
          else
            cp linux/rtl-sdr.rules linux/LEIA-ME-RTL-SDR.txt dist/PT2VHF-Sat-Tool/
            tar -C dist -czf "out/$base.tar.gz" PT2VHF-Sat-Tool
          fi
          ls -l out
      - name: Enviar pacote Linux/macOS diretamente à GitHub Release (sem artifacts)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(find out -maxdepth 1 -type f | wc -l)" -eq 1
          gh release upload "$RELEASE_TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
  release:
    name: Validar pacotes na GitHub Release
    needs: [prepare_release, build, build_unix]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os instaladores da release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern 'PT2VHF-Sat-Tool-v1.5.0-*'
      - name: Validar quatro pacotes e SHA-256
        run: |
          set -euo pipefail
          for file in \
            PT2VHF-Sat-Tool-v1.5.0-Win11-x64-Setup.exe \
            PT2VHF-Sat-Tool-v1.5.0-Win11-x64-Portable.exe \
            PT2VHF-Sat-Tool-v1.5.0-Linux-x64.tar.gz \
            PT2VHF-Sat-Tool-v1.5.0-macOS-arm64.dmg \
            PT2VHF-Sat-Tool-v1.5.0-Win11-x64-SHA256.txt; do
            test -s "release/$file" || { echo "::error::Pacote ausente: $file"; exit 1; }
          done
          cd release
          sed -i 's/\r$//' PT2VHF-Sat-Tool-v1.5.0-Win11-x64-SHA256.txt
          sha256sum --check PT2VHF-Sat-Tool-v1.5.0-Win11-x64-SHA256.txt

  publish_site:
    name: Atualizar o site e liberar a versão
    needs: [prepare_release, release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: pt2vhf-site-publish
    env:
      SITE_REPO: ${{ vars.SITE_REPO || 'alexpmr/PT2VHF-Site' }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout SAT Tool
        uses: actions/checkout@v4
      - name: Verificar credencial do site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo '::error::Secret SITE_DEPLOY_TOKEN ausente para publicar no PT2VHF-Site'
            exit 1
          fi
      - name: Baixar pacotes verificados diretamente da Release
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern 'PT2VHF-Sat-Tool-v1.5.0-*'
      - name: Checkout repositório do site
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          ref: main
          path: site
      - name: Atualizar instaladores, contadores e OTA
        run: |
          python3 scripts/publish_sat_to_site.py --version 1.5.0 --release-dir release --site-dir site \
            --notes 'v1.5.0: RTL-SDR reconhecido corretamente (correção da listagem) e plug and play: driver WinUSB instalado pelo próprio programa no Windows (libwdi) e permissões automáticas no Linux; diagnóstico do RTL-SDR; CAT autodetectado (varre portas e velocidades, TS-2000 e FT-817/818); qualidade da passagem em estrelas; janela de passagens configurável; popup com informações do satélite no mapa, seletor e catálogo; novo popup de boas-vindas. Windows x64, Linux x64 e macOS ARM64.'
      - name: Commit e push no site (Hostinger)
        working-directory: site
        run: |
          set -e
          git add -A downloads/sat-tool updates.json
          if git diff --cached --quiet; then
            echo 'Pacotes desta versão já estão no site.'
            exit 0
          fi
          git -c user.name='PT2VHF CI' -c user.email='ci@pt2vhf.com' commit -m 'release(sat): binários oficiais v1.5.0'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
      - name: Marcar release validada e publicada
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
